# Machine index of the corpus (single home for artifact metadata — Law 1).
# Content lives in the artifact files; this registry holds identity only.
# Mirrors are generated from here + each artifact's `## Agent Digest`.
#
# Coverage ratchet (docs/ratchets.yml — skills_corpus_coverage):
#   mirror: true    → mirrored now into .claude/skills + .cursor/rules
#   mirror_target: true → scheduled (W8); counted by the coverage ratchet
#   neither         → internal record; never mirrored
#
# A25+ reserved for the R8 corpus merge (ruby-agent-skills diff, react-agent-skills
# full pass) — react stack lands there.
artifacts:
  - id: A01
    title: Tooling Map and Selection Standards
    stacks: [ruby]
    layer: static
    file: docs/artifacts/A01-tooling-map.md
  - id: A02
    title: Background Job System Selection Standards
    stacks: [ruby, rails]
    layer: runtime
    file: docs/artifacts/A02-background-job-selection.md
    mirror_target: true
  - id: A03
    title: Exception Handling Standards
    stacks: [ruby, rails]
    layer: runtime
    file: docs/artifacts/A03-exception-handling.md
    mirror_target: true
  - id: A04
    title: Testing and Coverage Standards
    stacks: [ruby, rails]
    layer: runtime
    file: docs/artifacts/A04-testing-and-coverage.md
    mirror: true
    skills_slug: rspec-testing-standards
    skill_description: "Use when writing or editing RSpec specs or factories. One expectation per behavior, wall-clock ban, guard specs in the standard suite, delta rule, flaky quarantine ratchet."
    globs: "spec/**, app/**"
  - id: A05
