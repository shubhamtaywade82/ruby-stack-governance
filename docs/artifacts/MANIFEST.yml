# Machine index of the corpus (single home for artifact metadata — Law 1).
# Content lives in the artifact files; this registry holds identity only.
# Mirrors are generated from here + each artifact's `## Agent Digest`.
#
# Coverage ratchet (docs/ratchets.yml — skills_corpus_coverage):
#   mirror: true    → mirrored now into .claude/skills + .cursor/rules
#   mirror_target: true → scheduled (W8); counted by the coverage ratchet
#   neither         → internal record; never mirrored
#
# A25–A36: react stack corpus merge (R8) — component engineering, hooks,
# state, data fetching + RSC, forms, testing, E2E + visual, TypeScript
# contracts, accessibility, performance, security + supply chain, and agent
# evaluation. A37–A44: nodejs stack merge — modules/packages, async/event
# loop, streams/backpressure, HTTP services, process/runtime, logging,
# service testing, server security. A45+ reserved for ecosystem expansions
# (per-library skills stay in the pack repos).
